<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S-Mykhailo | Telegram and Discord bots</title>
<!-- Static fallback for link previews and crawlers that do not run JS.
     Real texts (EN/UA) live in js/content.js and replace these at load. -->
<meta name="description" content="Custom Telegram and Discord bots for small businesses and communities. Every project starts with a free working demo.">
<meta property="og:title" content="S-Mykhailo | Telegram and Discord bots">
<meta property="og:description" content="Custom Telegram and Discord bots for small businesses and communities. Every project starts with a free working demo.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/icon-512.png">
<meta name="theme-color" content="#0d0e17">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Runs before first paint: restore theme, mark JS as available. */
(function () {
  var d = document.documentElement;
  d.classList.add('js');
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/fx.css">
<noscript><style>.js-only{display:none!important}.noscript{display:block!important}</style></noscript>
</head>
<body>
<a class="skip" href="#main" data-i18n="ui.skip">Skip to content</a>
<div class="glow" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"></div>

<header class="bar">
  <div class="bar__in">
    <a class="logo" href="#top" aria-label="S-Mykhailo">S-Mykhailo<img class="logo__img" src="assets/avatars/logo.webp" alt="" width="28" height="28"></a>
    <nav class="nav" id="nav" data-i18n-attr="aria-label:ui.navLabel">
      <a href="#services" data-i18n="nav.services">Services</a>
      <a href="#demos" data-i18n="nav.demos">Demos</a>
      <a href="#process" data-i18n="nav.process">How I work</a>
      <a href="#pricing" data-i18n="nav.pricing">Pricing</a>
      <a href="#contact" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="bar__tools">
      <div class="seg" role="group" data-i18n-attr="aria-label:ui.langLabel">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="uk" aria-pressed="false">UA</button>
      </div>
      <button type="button" class="icon-btn" id="theme-btn" data-i18n-attr="aria-label:ui.theme">
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" class="icon-btn nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav" data-i18n-attr="aria-label:ui.menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <noscript><p class="noscript">This site needs JavaScript. Contact: https://t.me/savchenko_myhailo</p></noscript>

  <section class="hero" id="top">
    <span class="orb orb--a" aria-hidden="true"></span><span class="orb orb--b" aria-hidden="true"></span>
    <div class="hero__copy">
      <h1 data-i18n="hero.title">Custom Telegram and Discord bots for small business and communities</h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="actions">
        <a class="btn btn--primary" href="#contact" data-i18n="hero.cta">Get a bot</a>
        <a class="btn btn--ghost" href="#demos" data-i18n="hero.secondary">See the demos</a>
      </div>
      <p class="hint" data-i18n="hero.hint"></p>
    </div>
    <div class="hero__demo js-only">
      <div class="player" id="hero-player" data-scenario="blade"></div>
    </div>
  </section>

  <div class="ticker js-only" id="ticker" aria-hidden="true"><div class="ticker__track"></div></div>

  <section class="section" id="services" aria-labelledby="services-h">
    <div class="section__head rv">
      <h2 id="services-h" data-i18n="services.title">Services</h2>
      <p data-i18n="services.lead"></p>
    </div>
    <div class="svc">
      <div class="panel panel--tg spot rv">
        <h3 data-i18n="services.tg.title"></h3>
        <ul class="chatlist" id="svc-tg"></ul>
      </div>
      <div class="panel panel--dc spot rv">
        <h3 data-i18n="services.dc.title"></h3>
        <ul class="channels" id="svc-dc"></ul>
      </div>
    </div>
  </section>

  <section class="section" id="demos" aria-labelledby="demos-h">
    <div class="section__head rv">
      <h2 id="demos-h" data-i18n="demos.title">Demo bots</h2>
      <p data-i18n="demos.lead"></p>
    </div>
    <div class="demos">
      <ul class="botlist rv" id="botlist"></ul>
      <div class="demos__stage rv">
        <div class="player" id="demo-player"></div>
      </div>
    </div>
  </section>

  <section class="section" id="process" aria-labelledby="process-h">
    <div class="section__head rv">
      <h2 id="process-h" data-i18n="process.title">How I work</h2>
      <p data-i18n="process.lead"></p>
    </div>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="section" id="pricing" aria-labelledby="pricing-h">
    <div class="section__head rv">
      <h2 id="pricing-h" data-i18n="pricing.title">Pricing</h2>
      <p data-i18n="pricing.lead"></p>
    </div>
    <div class="prices" id="prices"></div>
    <p class="note rv" data-i18n="pricing.note"></p>
  </section>

  <section class="section contact" id="contact" aria-labelledby="contact-h">
    <div class="contact__box spot rv">
      <h2 id="contact-h" data-i18n="contact.title">Contact</h2>
      <p data-i18n="contact.lead"></p>
      <div id="contact-main"></div>
      <div class="contact__more" id="contact-more"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <span id="foot-copy"></span>
  <span data-i18n="footer.note"></span>
</footer>

<script src="js/content.js" defer></script>
<script src="js/scenarios.js" defer></script>
<script src="js/demo.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/fx.js" defer></script>
</body>
</html>
